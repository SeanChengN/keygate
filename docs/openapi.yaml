openapi: 3.1.0
info:
  title: Keygate API
  description: |
    License management API for software products.

    ## Authentication

    Public SDK endpoints (`/license/*`, `/releases/:slug/feed.*`) **do
    NOT require an API key**. The `license_key` in the request body is
    the credential; embedding an additional API key in client binaries
    is security theater (anyone can extract it). Stable release feeds
    are fully public — trust comes from the per-product Ed25519
    signature on each artifact, not from URL secrecy.

    For **server-to-server admin access** (CI/CD, billing backends,
    automation scripts) Keygate provides API keys with the `admin`
    scope. Pass them as `Authorization: Bearer kg_live_…`. They are
    equivalent to a logged-in admin session and can call any
    `/admin/*` endpoint. Mint them in the admin dashboard under
    **API Keys**.

    ## Idempotency

    Write endpoints (`/license/activate`, `/license/usage`,
    `/license/floating/checkout`, `/admin/licenses/:id/renew`) honor the `Idempotency-Key` header. A
    retry with the same key + same body replays the cached response
    (200/4xx) within 24 hours. Same key + different body → 422
    `IDEMPOTENCY_KEY_CONFLICT`. Concurrent retries while the original
    is still running → 409 `IDEMPOTENCY_IN_FLIGHT` (retry with backoff).

    ## Response Format

    All responses use a consistent envelope:

    ```json
    // Success
    {"success": true, "data": {...}}

    // Error
    {"success": false, "error": {"code": "ERROR_CODE", "message": "...", "details": {...}}}
    ```

    Replayed idempotent responses additionally carry the header
    `Idempotent-Replayed: true`.

    ## Existence-oracle hardening

    `/license/verify` and `/license/deactivate` collapse all
    "license-knowable" failures (suspended / revoked / expired /
    wrong device / wrong product) to a single `404 LICENSE_NOT_FOUND`.
    This prevents an attacker from probing valid `license_key` values
    by status-code differentiation. Paid users discover lifecycle
    state via email + the portal, not via these endpoints.
  version: 1.2.0
  contact:
    name: Keygate
    url: https://keygate.app
  license:
    name: AGPL v3
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: "{server}/api/v1"
    variables:
      server:
        default: http://localhost:9000
        description: Your Keygate server URL

# Public SDK endpoints have no auth at the route layer. Admin endpoints
# use BearerAuth or session cookies.
security: []

tags:
  - name: Customers
    description: Manage business customer records independently from sign-in users
  - name: License
    description: Activate, verify, and deactivate licenses
  - name: Entitlements
    description: Check feature access for a license
  - name: Usage
    description: Record and query usage against quotas
  - name: Seats
    description: Manage team members on a license
  - name: Floating
    description: Concurrent session checkout for floating licenses
  - name: Releases
    description: License-gated, device-proof-bound release downloads
  - name: Admin
    description: Administrative license operations

paths:
  /license/pubkey:
    get:
      tags: [License]
      summary: Get the Ed25519 verification key
      description: |
        Returns the Ed25519 public key paired with the server's
        signing key. SDKs fetch this once (or hard-code it after
        first run) to verify the offline token returned by
        /license/activate and /license/verify.
      responses:
        "200":
          description: Verification key
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      algorithm:
                        type: string
                        enum: [ed25519]
                      format:
                        type: string
                        enum: [hex]
                      public_key:
                        type: string
                        description: 32-byte Ed25519 public key, hex-encoded (64 chars)

  /license/activate:
    post:
      tags: [License]
      summary: Activate a license
      description: |
        Registers a device or user identifier against a license.
        Returns a signed verification token.

        - Re-activating the same identifier returns `already_activated`
          without consuming an additional slot
        - Atomic enforcement of `max_activations` from the plan
          (concurrent retries can never exceed the cap)
        - Brute-force protected: failed attempts trigger a per-IP
          exponential lockout (defaults: 5 failures → 30s lockout,
          configurable via `BF_MAX_FAILS` / `BF_LOCKOUT_SECONDS`)
        - Supports `Idempotency-Key` header for safe retries
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
            maxLength: 256
          description: Same key + same body replays cached response for 24h
          required: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license_key, identifier]
              properties:
                license_key:
                  type: string
                  example: "KG-ABCD1234-EFGH5678-IJKL9012-MNOP3456"
                identifier:
                  type: string
                  description: Unique device ID or user email
                  example: "device-a1b2c3d4"
                identifier_type:
                  type: string
                  enum: [device, user]
                  default: device
                label:
                  type: string
                  description: Human-readable name for the activation
                  example: "MacBook Pro"
                product_id:
                  type: string
                  description: Product UUID included in the signed device proof
                device_public_key:
                  type: string
                  description: Base64url raw Ed25519 public key. First proof-aware activation binds this key permanently to the activation.
                proof_timestamp:
                  type: integer
                  format: int64
                  description: Current Unix timestamp; accepted within a five-minute clock window
                proof_nonce:
                  type: string
                  description: Base64url 16-byte single-use nonce
                proof_signature:
                  type: string
                  description: Base64url Ed25519 signature over the canonical action and request fields
      responses:
        "200":
          description: Activation successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivateResponse"
        "400":
          description: Validation failure (missing fields, identifier too long)
        "403":
          description: License not usable (expired / suspended / revoked / canceled)
        "404":
          description: License not found
        "409":
          description: |
            - `ACTIVATION_LIMIT` — slots exhausted
            - `IDEMPOTENCY_IN_FLIGHT` — concurrent retry, try again
        "422":
          description: |
            `IDEMPOTENCY_KEY_CONFLICT` — same Idempotency-Key reused
            with a different body
        "429":
          description: Brute-force lockout (`LOCKED_OUT`)

  /license/verify:
    post:
      tags: [License]
      summary: Verify a license activation
      description: |
        Checks that a license is valid and the identifier is activated.
        Returns the license status, plan features, and a signed token.

        The signed token can be verified offline using the server's
        Ed25519 public key (`GET /license/pubkey`). Token format is
        `base64url(payload).base64url(ed25519_signature)`, where the
        signed bytes are the base64url-encoded payload string.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license_key, identifier]
              properties:
                license_key:
                  type: string
                identifier:
                  type: string
                product_id:
                  type: string
                device_public_key:
                  type: string
                proof_timestamp:
                  type: integer
                  format: int64
                proof_nonce:
                  type: string
                proof_signature:
                  type: string
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResponse"
        "404":
          description: |
            `LICENSE_NOT_FOUND` — collapsed response for ALL of:
            license doesn't exist / belongs to another product /
            wrong device / suspended / revoked / expired. Intentional
            oracle-hardening (see top-level docs).

  /license/deactivate:
    post:
      tags: [License]
      summary: Deactivate a device or user
      description: Removes an activation, freeing a slot for a new device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license_key, identifier]
              properties:
                license_key:
                  type: string
                identifier:
                  type: string
                  description: Required once any activation for this license is device-key bound
                product_id:
                  type: string
                device_public_key:
                  type: string
                proof_timestamp:
                  type: integer
                  format: int64
                proof_nonce:
                  type: string
                proof_signature:
                  type: string
      responses:
        "200":
          description: Deactivated
        "404":
          description: |
            `LICENSE_NOT_FOUND` — collapsed for missing license OR
            unknown identifier (oracle-hardening).

  /license/entitlements:
    post:
      tags: [Entitlements]
      summary: Check feature entitlements
      description: |
        Returns all features available for the license's plan,
        including quota usage for metered features.
        Includes add-on features if any are attached.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license_key]
              properties:
                license_key:
                  type: string
                feature:
                  type: string
                  description: Optional — check a single feature only
      responses:
        "200":
          description: Entitlements check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementResponse"

  /license/usage:
    post:
      tags: [Usage]
      summary: Record usage
      description: |
        Increments a usage counter for a metered feature.
        The increment is **atomic** — concurrent requests will never exceed the quota.

        Returns the updated counter with remaining balance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license_key, feature]
              properties:
                license_key:
                  type: string
                feature:
                  type: string
                  example: "api_calls"
                quantity:
                  type: integer
                  default: 1
                  minimum: 1
                metadata:
                  type: object
                  description: Arbitrary metadata stored with the event
      responses:
        "200":
          description: Usage recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageResponse"
        "429":
          description: Quota exceeded

  /license/usage/status:
    post:
      tags: [Usage]
      summary: Get quota status
      description: Returns current usage and remaining quota for a feature.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license_key, feature]
              properties:
                license_key:
                  type: string
                feature:
                  type: string
      responses:
        "200":
          description: Quota status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaStatusResponse"

  # Seat management moved off the SDK namespace (license_key is the
  # device credential, not a team-management credential). All three
  # endpoints now live under /portal and are gated by the portal
  # session cookie — the license_key in the body only NAMES the
  # target license; the cookie is what authenticates.
  /portal/seats:
    post:
      tags: [Seats]
      summary: List seats on a license (portal)
      description: |
        Returns all team members for a license owned by the
        authenticated portal user (or one on which they hold a seat).
        Returns `404 LICENSE_NOT_FOUND` if the license doesn't exist
        OR the caller has no relationship to it (oracle-safe).
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license_key]
              properties:
                license_key:
                  type: string
      responses:
        "200":
          description: Seat list
        "401":
          description: Not signed in
        "404":
          description: License not found, or not yours

  /portal/seats/add:
    post:
      tags: [Seats]
      summary: Invite a team member (portal)
      description: |
        Adds a seat to the license. Only the license owner OR an
        accepted seat with role `admin` may call this. Seat roles
        are 2-tier — the license owner (matched by `license.email`)
        is implicit and never has a seat row of their own.
        Idempotent — adding the same email twice with the seat
        still pending rotates the invite token and re-sends the
        email; if the seat is already accepted, returns the existing
        seat with no email re-send.

        Cannot invite the license owner's own email (400). Enforces
        the plan's `max_seats` (409 SEAT_LIMIT). When a seat is
        added, an invite email goes to the recipient; they accept
        via `/invites/accept`.
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license_key, email]
              properties:
                license_key:
                  type: string
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum: [admin, member]
                  default: member
                  description: |
                    Seat-level role. `admin` may invite/remove other
                    seats; `member` may only use the license. The
                    license owner (identified by `license.email`) is
                    implicit and never has a seat row of their own.
      responses:
        "200":
          description: Seat added, restored, or already exists
        "400":
          description: Self-invite or invalid role
        "401":
          description: Not signed in
        "404":
          description: License not found, or caller lacks mutation rights
        "409":
          description: Seat limit reached (`SEAT_LIMIT`)

  /portal/seats/remove:
    post:
      tags: [Seats]
      summary: Remove a team member (portal)
      description: |
        Soft-removes a seat (sets `removed_at`). Same auth rules as
        `/portal/seats/add` — license owner or accepted admin seat
        only.
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license_key, seat_id]
              properties:
                license_key:
                  type: string
                seat_id:
                  type: string
      responses:
        "200":
          description: Seat removed
        "401":
          description: Not signed in
        "404":
          description: License or seat not found, or caller lacks mutation rights

  /invites/accept:
    post:
      tags: [Seats]
      summary: Accept a seat invite (public, token-only)
      description: |
        Consumes the plain invite token shipped in the seat-invite
        email. The token IS the email-ownership proof — no prior
        session is required. On success the server:

        - Creates a user record keyed off the seat's email if none
          exists (lookup is case-insensitive against `users.email`)
        - Binds `seats.user_id` and stamps `accepted_at`
        - Clears `invite_token_hash` so the same token can't be
          replayed
        - Issues a portal session cookie so the invitee lands in
          the portal in one click

        All failure modes (unknown / expired / removed / already
        accepted token, or a license that is suspended / revoked /
        canceled / expired) collapse to one opaque
        `404 SEAT_INVITE_INVALID` so an attacker can't probe token
        validity by response shape. When a policy check fails (e.g.
        license suspended at accept time), the seat row is rolled
        back to its pre-accept state and the token is consumed
        anyway; the owner must re-invite to mint a fresh token.

        IP rate-limited to 60 requests/minute. No authentication
        header or cookie is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: 64-char hex token from the invite email
      responses:
        "200":
          description: "Invite accepted; `Set-Cookie: session=…` issued"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      user_id: { type: string, format: uuid }
                      email: { type: string, format: email }
                      license_id: { type: string, format: uuid }
                      product_name: { type: string }
                      role: { type: string, enum: [admin, member] }
        "404":
          description: Invalid, expired, already-used, or removed token (`SEAT_INVITE_INVALID`)
        "429":
          description: Rate limit exceeded

  /license/floating/checkout:
    post:
      tags: [Floating]
      summary: Checkout a floating session
      description: |
        Acquires a concurrent session slot. The session expires after the plan's
        `floating_timeout` (default 30 minutes) unless refreshed via heartbeat.

        - Atomic: concurrent checkouts will never exceed `max_activations`
        - Re-checkout with the same identifier refreshes the existing session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license_key, identifier]
              properties:
                license_key:
                  type: string
                identifier:
                  type: string
                  example: "workstation-001"
                label:
                  type: string
      responses:
        "200":
          description: Session checked out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FloatingCheckoutResponse"
        "409":
          description: All sessions in use

  /license/floating/checkin:
    post:
      tags: [Floating]
      summary: Release a floating session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license_key, identifier]
              properties:
                license_key:
                  type: string
                identifier:
                  type: string
      responses:
        "200":
          description: Session released

  /license/floating/heartbeat:
    post:
      tags: [Floating]
      summary: Extend a floating session
      description: Refreshes the session expiry. Call periodically to keep the session alive.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license_key, identifier]
              properties:
                license_key:
                  type: string
                identifier:
                  type: string
      responses:
        "200":
          description: Session extended

  /license/download:
    post:
      tags: [Releases]
      summary: Get a license-gated download URL
      description: |
        Returns a short-lived presigned URL for the artifact matching
        `(product, channel, platform, version?)`. Every request requires
        an active license, a bound installation identifier, and a fresh
        Ed25519 device proof. Public auto-update feeds are not registered.

        If `version` is omitted, returns the latest published release
        in the channel that has an artifact for `platform`. Channel
        fallback chain applies (beta sees beta + stable, etc.).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license_key, platform]
              properties:
                license_key:
                  type: string
                identifier:
                  type: string
                  description: Required once this license has a device-key-bound activation
                product_id:
                  type: string
                device_public_key:
                  type: string
                proof_timestamp:
                  type: integer
                  format: int64
                proof_nonce:
                  type: string
                proof_signature:
                  type: string
                platform:
                  type: string
                  enum:
                    [
                      darwin-arm64,
                      darwin-x64,
                      windows-arm64,
                      windows-x64,
                      linux-arm64,
                      linux-x64,
                      linux-armhf,
                    ]
                version:
                  type: string
                  description: "Optional. Empty = latest in channel."
                  example: "1.2.3"
                channel:
                  type: string
                  enum: [stable, beta, alpha, dev]
                  default: stable
      responses:
        "200":
          description: Signed download URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        format: uri
                      expires_at:
                        type: string
                        format: date-time
                      version:
                        type: string
                      platform:
                        type: string
                      sha256:
                        type: string
                      file_size:
                        type: integer
                        format: int64
        "400":
          description: Invalid platform / channel
        "403":
          description: License inactive (cannot download)
        "404":
          description: License not found or no release matches
        "410":
          description: Specifically-requested version was yanked
        "503":
          description: Storage not configured on this server

  /admin/licenses:
    get:
      tags: [Admin]
      summary: List licenses with redacted keys
      description: |
        Returns licenses without plaintext activation credentials. The
        top-level `license_key_hints` map contains only the last four
        characters, keyed by license id.
      security: [{BearerAuth: []}, {CookieAuth: []}]
      responses:
        "200":
          description: License list and last-four key hints

    post:
      tags: [Admin]
      summary: Issue a license
      description: |
        Issues a license and creates its subscription record atomically when
        the selected plan is a subscription or trial. For a subscription,
        omitting `valid_until` creates one configured billing period; providing
        it sets a custom first period end in both records.
      security: [{BearerAuth: []}, {CookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, plan_id, email]
              properties:
                product_id: {type: string, format: uuid}
                plan_id: {type: string, format: uuid}
                email: {type: string, format: email}
                customer_id: {type: string, format: uuid}
                notes: {type: string}
                external_customer_id: {type: string, maxLength: 256}
                external_workspace_id: {type: string, maxLength: 256}
                valid_until:
                  type: string
                  description: Optional future YYYY-MM-DD date or RFC 3339 timestamp. The server normalizes it to 23:59:59 in the configured system timezone.
      responses:
        "201":
          description: License and any subscription record created; the full key is returned only in this response and must not be cached
        "400": {description: Invalid request, plan mismatch, or non-future expiry}
        "404": {description: Product, plan, or customer not found}
        "409": {description: Customer is archived}

  /admin/licenses/{id}:
    get:
      tags: [Admin]
      summary: Get a license with a redacted key
      security: [{BearerAuth: []}, {CookieAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: License detail with `license_key_hint`, never the full key
        "404": {description: License not found}

    delete:
      tags: [Admin]
      summary: Permanently delete a revoked unpaid license
      description: |
        Permanently deletes a revoked license and all license-owned data that
        is protected by cascade foreign keys, including subscriptions,
        activations, seats, usage, floating sessions, and add-ons. The
        deletion audit tombstone is retained and never contains the license
        key. Licenses linked to a payment provider or external subscription
        cannot be deleted. This operation requires the admin scope;
        licenses:write API keys are not accepted.
      security: [{BearerAuth: []}, {CookieAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204": {description: License permanently deleted}
        "404": {description: LICENSE_NOT_FOUND}
        "409":
          description: LICENSE_NOT_REVOKED or LICENSE_PAYMENT_LINKED

  /admin/licenses/{id}/key:
    get:
      tags: [Admin]
      summary: Reveal one license key
      description: |
        Returns one plaintext license key to a background administrator.
        This route does not accept a licenses:write API key, records a
        `key_revealed` audit event without the key, and responds with
        `Cache-Control: no-store`.
      security: [{BearerAuth: []}, {CookieAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Plaintext key for this license}
        "404": {description: License not found}
        "503": {description: Stored license key cannot be decrypted}

  /admin/licenses/{id}/valid-until:

    post:
      tags: [Admin]
      summary: Set or clear a license expiry
      description: |
        Sets a future YYYY-MM-DD date or RFC 3339 expiry. The server interprets
        it in Settings → General → Timezone and normalizes it to 23:59:59 on
        that local date. An empty value clears the expiry for a
        non-subscription license. Manual subscriptions require a non-empty
        expiry and update `licenses.valid_until` and the latest subscription's
        `current_period_end` atomically. Stripe-managed licenses are rejected.
        Changing the date does not reinstate an expired license. A successful
        change dispatches `license.expiry_changed`.
      security: [{BearerAuth: []}, {CookieAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [valid_until]
              properties:
                valid_until:
                  type: string
                  description: Future YYYY-MM-DD date or RFC 3339 timestamp, or empty for a non-subscription license.
      responses:
        "200": {description: License expiry changed}
        "400": {description: Invalid or non-future expiry}
        "404": {description: License not found}
        "409":
          description: STRIPE_MANAGED, SUBSCRIPTION_EXPIRY_REQUIRED, or SUBSCRIPTION_RECORD_REQUIRED

  /admin/licenses/{id}/renew:
    post:
      tags: [Admin]
      summary: Renew a manual subscription for one plan period
      description: |
        Renews a manually-issued monthly or yearly subscription. Early
        renewal extends the existing commercial expiry; overdue renewal
        starts from the current server date. Stripe-backed licenses and
        suspended or revoked licenses are rejected.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            maxLength: 256
          description: A unique operation key; retries replay the original result.
      responses:
        "200":
          description: Subscription renewed for exactly one plan period
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      license_id: { type: string }
                      status: { type: string, enum: [active] }
                      old_valid_until: { type: string, format: date-time, nullable: true }
                      valid_until: { type: string, format: date-time }
                      current_period_start: { type: string, format: date-time }
                      current_period_end: { type: string, format: date-time }
        "400":
          description: Missing Idempotency-Key
        "409":
          description: Not a manual subscription, or license must be reinstated first

  /admin/customers:
    get:
      tags: [Customers]
      summary: List customers
      security: [{BearerAuth: []}, {CookieAuth: []}]
      parameters:
        - {name: search, in: query, schema: {type: string}}
        - {name: kind, in: query, schema: {type: string, enum: [individual, organization]}}
        - {name: status, in: query, schema: {type: string, enum: [active, archived, all]}}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200": {description: Paginated customer records}
    post:
      tags: [Customers]
      summary: Create a customer
      security: [{BearerAuth: []}, {CookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CustomerInput"}
      responses:
        "201": {description: Customer created}
        "409": {description: External or Stripe customer ID already exists}

  /admin/customers/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Customers]
      summary: Get a customer and license-derived activity
      security: [{BearerAuth: []}, {CookieAuth: []}]
      responses:
        "200": {description: Customer details}
        "404": {description: Customer not found}
    patch:
      tags: [Customers]
      summary: Update a customer without changing license delivery emails
      security: [{BearerAuth: []}, {CookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CustomerInput"}
      responses:
        "200": {description: Customer updated}

  /admin/customers/{id}/archive:
    post:
      tags: [Customers]
      summary: Archive a customer
      security: [{BearerAuth: []}, {CookieAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Customer archived; related licenses are unchanged}

  /admin/customers/{id}/restore:
    post:
      tags: [Customers]
      summary: Restore an archived customer
      security: [{BearerAuth: []}, {CookieAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Customer restored}

  /admin/licenses/{id}/customer:
    patch:
      tags: [Customers]
      summary: Assign or clear a license customer
      security: [{BearerAuth: []}, {CookieAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {customer_id: {type: string, description: Empty string clears the association}}
      responses:
        "200": {description: Association changed}
        "409": {description: Customer is archived}

  /admin/settings:
    get:
      tags: [Admin]
      summary: Read safe dashboard settings
      description: |
        SMTP passwords and Stripe server-owned fields are omitted.
        `secrets_set.smtp_password` indicates whether an SMTP password
        is stored without returning it.
      security: [{BearerAuth: []}, {CookieAuth: []}]
      responses:
        "200": {description: Safe settings and secret-presence flags}
    put:
      tags: [Admin]
      summary: Update dashboard-owned settings
      description: |
        Only submitted dashboard-owned fields are changed. An empty
        `smtp_password` preserves the stored password; clearing it
        requires the dedicated DELETE operation.
      security: [{BearerAuth: []}, {CookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings:
                  type: object
                  additionalProperties: {type: string}
      responses:
        "200": {description: Settings saved}
        "400": {description: Unknown setting or invalid timezone}

  /admin/settings/secrets/{key}:
    delete:
      tags: [Admin]
      summary: Clear a dashboard-owned secret
      description: |
        Explicitly clears a supported secret setting. Currently only
        `smtp_password` is accepted; Stripe server-owned credentials
        cannot be cleared through this endpoint.
      security: [{BearerAuth: []}, {CookieAuth: []}]
      parameters:
        - {name: key, in: path, required: true, schema: {type: string, enum: [smtp_password]}}
      responses:
        "200": {description: Secret cleared}
        "404": {description: Unsupported secret key}

components:
  parameters:
    ProductSlug:
      in: path

      name: product_slug
      required: true
      schema: { type: string }
      example: my-app
    Platform:
      in: query
      name: platform
      required: true
      schema:
        type: string
        enum:
          [
            darwin-arm64,
            darwin-x64,
            windows-arm64,
            windows-x64,
            linux-arm64,
            linux-x64,
            linux-armhf,
          ]
    Channel:
      in: query
      name: channel
      schema:
        type: string
        enum: [stable, beta, alpha, dev]
        default: stable
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        Admin API key (`kg_live_…`). Used for server-to-server
        access to `/admin/*` (NOT for public SDK endpoints in this
        document). Requires the `admin` scope. Mint in dashboard.
    CookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: |
        Portal session cookie issued by `/auth/otp/verify`,
        `/auth/dev-login`, or `/invites/accept`. Required for
        `/portal/*` endpoints. The cookie is HttpOnly + SameSite=Lax;
        browsers attach it automatically.

  schemas:
    CustomerInput:
      type: object
      required: [kind, name, primary_email]
      properties:
        kind: {type: string, enum: [individual, organization]}
        name: {type: string, maxLength: 200}
        primary_email: {type: string, format: email, maxLength: 254}
        phone: {type: string, maxLength: 50}
        company: {type: string, maxLength: 200}
        notes: {type: string, maxLength: 4000}
        external_customer_id: {type: string, maxLength: 256}
        stripe_customer_id: {type: string, maxLength: 256}
    Customer:
      allOf:
        - {$ref: "#/components/schemas/CustomerInput"}
        - type: object
          required: [id, created_at, updated_at]
          properties:
            id: {type: string, format: uuid}
            archived_at: {type: string, format: date-time, nullable: true}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    ActivateResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            status:
              type: string
              enum: [activated, already_activated]
            license_id:
              type: string
              format: uuid
            token:
              type: string
              description: |
                Ed25519-signed offline verification token. Format:
                `<base64url-payload>.<base64url-signature>`. Verify
                using the server's public key from /license/pubkey.
                Protocol version 2 signs `ver`, license type `lty`, plan
                name `pnm`, commercial expiry `vld`, the fixed online
                lease expiry `exp`, and commercial grace days `grc`.

    VerifyResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            status:
              type: string
              enum: [active, trialing, past_due, canceled, expired, suspended, revoked]
            plan_id:
              type: string
            plan_name:
              type: string
            license_type:
              type: string
              enum: [subscription, perpetual, trial]
            billing_interval:
              type: string
              enum: [month, year]
            valid_until:
              type: string
              format: date-time
              nullable: true
            lease_expires_at:
              type: string
              format: date-time
            features:
              type: object
              description: "Key-value map of feature entitlements"
              example:
                premium_support: true
                api_calls: "50000"
                storage_gb: "100"
            token:
              type: string
            grace_days:
              type: integer

    EntitlementResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            licensed:
              type: boolean
            status:
              type: string
            plan_id:
              type: string
            plan_name:
              type: string
            features:
              type: object
              additionalProperties:
                type: object
                properties:
                  enabled:
                    type: boolean
                  value_type:
                    type: string
                    enum: [bool, int, string, quota, flag]
                  value:
                    type: string
                  used:
                    type: integer
                    nullable: true
                  limit:
                    type: integer
                    nullable: true
                  remaining:
                    type: integer
                    nullable: true
                  period:
                    type: string
                  resets_at:
                    type: string
                    format: date-time

    UsageResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            accepted:
              type: boolean
            used:
              type: integer
              example: 451
            limit:
              type: integer
              example: 1000
            remaining:
              type: integer
              example: 549
            period:
              type: string
              example: monthly
            period_key:
              type: string
              example: "2026-03"

    QuotaStatusResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            feature:
              type: string
            used:
              type: integer
            limit:
              type: integer
            remaining:
              type: integer
            period:
              type: string
            period_key:
              type: string

    FloatingCheckoutResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            session_id:
              type: string
              format: uuid
            expires_at:
              type: string
              format: date-time
            active_sessions:
              type: integer
            max_sessions:
              type: integer

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: QUOTA_EXCEEDED
            message:
              type: string
              example: "usage quota exceeded for api_calls"
            details:
              type: object
              nullable: true
