name: Release

on:
  push:
    tags:
      - "v*-dw.*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate tagged source
    uses: ./.github/workflows/ci.yml

  release:
    name: GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate maintained tag format
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-dw\.[1-9][0-9]*$ ]] || {
            echo "Release tag must match vX.Y.Z-dw.N" >&2
            exit 1
          }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
